<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculator frontend application">
    <title>Calculator</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator" aria-labelledby="calculator-title">
        <header class="calculator__header">
          <h1 id="calculator-title">Calculator</h1>
        </header>

        <div class="display" aria-live="polite">
          <div class="display__group">
            <span class="display__label">Expression</span>
            <output id="expression-display" class="display__expression">0</output>
          </div>
          <div class="display__group display__group--result">
            <span class="display__label">Result</span>
            <output id="result-display" class="display__result"></output>
          </div>
        </div>

        <div class="keypad" aria-label="Calculator keypad">
          <button class="key key--clear" type="button" data-action="clear">AC</button>
          <button class="key key--operator" type="button" data-value="(" aria-label="Left parenthesis">(</button>
          <button class="key key--operator" type="button" data-value=")" aria-label="Right parenthesis">)</button>

          <button class="key" type="button" data-value="7">7</button>
          <button class="key" type="button" data-value="8">8</button>
          <button class="key" type="button" data-value="9">9</button>
          <button class="key key--operator" type="button" data-value="/" aria-label="Divide">÷</button>

          <button class="key" type="button" data-value="4">4</button>
          <button class="key" type="button" data-value="5">5</button>
          <button class="key" type="button" data-value="6">6</button>
          <button class="key key--operator" type="button" data-value="*" aria-label="Multiply">×</button>

          <button class="key" type="button" data-value="1">1</button>
          <button class="key" type="button" data-value="2">2</button>
          <button class="key" type="button" data-value="3">3</button>
          <button class="key key--operator" type="button" data-value="-" aria-label="Subtract">−</button>

          <button class="key key--zero" type="button" data-value="0">0</button>
          <button class="key" type="button" data-value=".">.</button>
          <button class="key key--operator" type="button" data-value="+" aria-label="Add">+</button>

          <button class="key key--equals" type="button" data-action="calculate">=</button>
        </div>
      </section>

      <aside class="history" aria-labelledby="history-title">
        <div class="history__heading">
          <div>
            <p class="eyebrow">RECENT</p>
            <h2 id="history-title">History</h2>
          </div>
        </div>
        <ol id="history-list" class="history__list">
          <li class="history__empty">Loading history...</li>
        </ol>
      </aside>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
